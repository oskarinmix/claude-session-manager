<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Claude Session Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f27"/>
      <stop offset="1" stop-color="#11141a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="240" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="959" height="239" rx="16" fill="none" stroke="#2c323d"/>

  <!-- stacked transcript cards -->
  <g transform="translate(64 52)">
    <rect x="28" y="0" width="148" height="104" rx="10" fill="#1f2530" stroke="#3a4250"/>
    <rect x="14" y="14" width="148" height="104" rx="10" fill="#222a36" stroke="#465062"/>
    <rect x="0" y="28" width="148" height="104" rx="10" fill="#262f3d" stroke="#d97757" stroke-width="1.5"/>
    <rect x="16" y="48" width="68" height="8" rx="4" fill="#d97757"/>
    <rect x="16" y="68" width="116" height="6" rx="3" fill="#5b6576"/>
    <rect x="16" y="84" width="96" height="6" rx="3" fill="#5b6576"/>
    <rect x="16" y="100" width="108" height="6" rx="3" fill="#5b6576"/>
    <text x="16" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b95a5">.jsonl</text>
  </g>

  <text x="276" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f2efe9">Session Manager</text>
  <text x="278" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a7b0bd">Resume, recap, rename, compact, join and clean up</text>
  <text x="278" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a7b0bd">your Claude Code sessions from one pane.</text>
  <text x="278" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#d97757" letter-spacing="1">CLAUDE CODE MOD  ·  /sessions</text>
</svg>
